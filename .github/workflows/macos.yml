name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple silicon and Intel)"
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugin/OpenPianoPlugin_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aumu Opfp Opfl

      - name: Package
        run: |
          mkdir -p dist
          cd build/plugin/OpenPianoPlugin_artefacts/Release
          ditto -c -k --keepParent AU/*.component "$GITHUB_WORKSPACE/dist/AU.zip"
          ditto -c -k --keepParent VST3/*.vst3 "$GITHUB_WORKSPACE/dist/VST3.zip"
          ditto -c -k --keepParent Standalone/*.app "$GITHUB_WORKSPACE/dist/Standalone.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: nocturne-macos-unsigned
          path: dist/*.zip
